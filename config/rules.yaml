version: "1.1.0"
last_updated: "2026-10-06"
description: "Avtomatlashtirilgan 4-kamerali imtihon qoidalari pasporti (3 tilda)"

rules:
  - code: "SEATBELT_UNFASTENED"
    penalty: 10
    critical: false
    debounce_frames: 15
    cooldown_seconds: 30.0
    min_confidence: 0.85
    exercise_binding: [] # Bo'sh ro'yxat = barcha mashqlarda faol
    translations:
      uz-Latn:
        title: "Xavfsizlik kamari taqilmagan"
        # TODO: rasmiy metodika bilan almashtirilsin
        screen_text: "Xavfsizlik kamarini taqmadingiz!"
        voice_file: "seatbelt_unfastened.wav"
        voice_text: "Diqqat! Xavfsizlik kamarini taqing."
        reviewed: true
        reviewer: "metodist_uz"
      uz-Cyrl:
        title: "Хавфсизлик камари тақилмаган"
        # TODO: rasmiy metodika bilan almashtirilsin
        screen_text: "Хавфсизлик камарини тақмадингиз!"
        voice_file: "seatbelt_unfastened.wav"
        voice_text: "Диққат! Хавфсизлик камарини тақинг."
        reviewed: true
        reviewer: "metodist_uz"
      ru:
        title: "Не пристёгнут ремень безопасности"
        # TODO: rasmiy metodika bilan almashtirilsin
        screen_text: "Ремень безопасности не пристёгнут!"
        voice_file: "seatbelt_unfastened.wav"
        voice_text: "Внимание! Пристегните ремень безопасности."
        reviewed: true
        reviewer: "metodist_ru"

  - code: "CONE_TOUCH"
    penalty: 25
    critical: false
    debounce_frames: 5
    cooldown_seconds: 5.0
    min_confidence: 0.80
    exercise_binding: ["ZMEIKA", "PARALLEL_PARKING", "GARAGE_REVERSE", "TURN_90"]
    translations:
      uz-Latn:
        title: "Yo'l belgilovchi konusga tegish"
        # TODO: rasmiy metodika bilan almashtirilsin
        screen_text: "Konusga tegdingiz!"
        voice_file: "cone_touch.wav"
        voice_text: "Diqqat! Belgilangan konusga tegdilar."
        reviewed: true
        reviewer: "metodist_uz"
      uz-Cyrl:
        title: "Йўл белгиловчи конусга тегиш"
        # TODO: rasmiy metodika bilan almashtirilsin
        screen_text: "Конусга тегдингиз!"
        voice_file: "cone_touch.wav"
        voice_text: "Диққат! Белгиланган конусга тегдилар."
        reviewed: true
        reviewer: "metodist_uz"
      ru:
        title: "Касание разметочного конуса"
        # TODO: rasmiy metodika bilan almashtirilsin
        screen_text: "Касание разметочного конуса!"
        voice_file: "cone_touch.wav"
        voice_text: "Внимание! Зафиксировано касание конуса."
        reviewed: true
        reviewer: "metodist_ru"

  - code: "STOP_LINE_VIOLATION"
    penalty: 20
    critical: false
    debounce_frames: 8
    cooldown_seconds: 10.0
    min_confidence: 0.82
    exercise_binding: ["START", "ESTAKADA", "STOP", "FINISH"]
    translations:
      uz-Latn:
        title: "To'xtash chizig'i qoidasini buzish"
        # TODO: rasmiy metodika bilan almashtirilsin
        screen_text: "To'xtash chizig'i bosildi yoki o'tib ketildi!"
        voice_file: "stop_line_violation.wav"
        voice_text: "Stop chizig'i qoidasi buzildi."
        reviewed: true
        reviewer: "metodist_uz"
      uz-Cyrl:
        title: "Тўхташ чизиғи қоидасини бузиш"
        # TODO: rasmiy metodika bilan almashtirilsin
        screen_text: "Тўхташ чизиғи босилди ёки ўтиб кетилди!"
        voice_file: "stop_line_violation.wav"
        voice_text: "Стоп чизиғи қоидаси бузилди."
        reviewed: true
        reviewer: "metodist_uz"
      ru:
        title: "Нарушение стоп-линии"
        # TODO: rasmiy metodika bilan almashtirilsin
        screen_text: "Наезд или пересечение стоп-линии!"
        voice_file: "stop_line_violation.wav"
        voice_text: "Внимание! Нарушено правило стоп-линии."
        reviewed: true
        reviewer: "metodist_ru"

  - code: "HILL_ROLLBACK"
    penalty: 30
    critical: false
    debounce_frames: 10
    cooldown_seconds: 15.0
    min_confidence: 0.85
    exercise_binding: ["ESTAKADA"]
    translations:
      uz-Latn:
        title: "Estakadada orqaga sirg'alish (>20 sm)"
        # TODO: rasmiy metodika bilan almashtirilsin
        screen_text: "Estakadada orqaga sirg'alish ruxsat etilganidan oshdi!"
        voice_file: "hill_rollback.wav"
        voice_text: "Avtomobil estakadada orqaga sirg'aldi."
        reviewed: true
        reviewer: "metodist_uz"
      uz-Cyrl:
        title: "Эстакадада орқага сирғалиш (>20 см)"
        # TODO: rasmiy metodika bilan almashtirilsin
        screen_text: "Эстакадада орқага сирғалиш рухсат этилганидан ошди!"
        voice_file: "hill_rollback.wav"
        voice_text: "Автомобиль эстакадада орқага сирғалди."
        reviewed: true
        reviewer: "metodist_uz"
      ru:
        title: "Откат автомобиля на эстакаде (>20 см)"
        # TODO: rasmiy metodika bilan almashtirilsin
        screen_text: "Откат назад на подъеме превысил допустимую норму!"
        voice_file: "hill_rollback.wav"
        voice_text: "Откат автомобиля назад на эстакаде."
        reviewed: true
        reviewer: "metodist_ru"

  - code: "SPEED_EXCEEDED"
