      uz-Latn:
        title: "Maksimal ruxsat etilgan tezlikdan oshish"
        # TODO: rasmiy metodika bilan almashtirilsin
        screen_text: "Avtodromda belgilangan tezlikdan oshdingiz!"
        voice_file: "speed_exceeded.wav"
        voice_text: "Tezlik oshirildi. Tezlikni pasaytiring."
        reviewed: true
        reviewer: "metodist_uz"
      uz-Cyrl:
        title: "Максимал рухсат этилган тезликдан ошиш"
        # TODO: rasmiy metodika bilan almashtirilsin
        screen_text: "Автодромда белгиланган тезликдан ошдингиз!"
        voice_file: "speed_exceeded.wav"
        voice_text: "Тезлик оширилди. Тезликни пасайтиринг."
        reviewed: true
        reviewer: "metodist_uz"
      ru:
        title: "Превышение разрешённой скорости"
        # TODO: rasmiy metodika bilan almashtirilsin
