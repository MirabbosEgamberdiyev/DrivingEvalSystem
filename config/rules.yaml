        voice_file: "indicator_missed.wav"
        voice_text: "Burilish chirog'i yoqilmadi."
        reviewed: true
        reviewer: "metodist_uz"
      uz-Cyrl:
        title: "Бурилиш чироғи ёқилмади"
        # TODO: rasmiy metodika bilan almashtirilsin
        screen_text: "Бурилиш чироғи (поворотник) ёқилмади!"
        voice_file: "indicator_missed.wav"
        voice_text: "Бурилиш чироғи ёқилмади."
        reviewed: true
        reviewer: "metodist_uz"
      ru:
        title: "Не включен указатель поворота"
        # TODO: rasmiy metodika bilan almashtirilsin
