    debounce_frames: 3
    cooldown_seconds: 999.0
    min_confidence: 0.85
    exercise_binding: []
    translations:
      uz-Latn:
        title: "To'siqqa to'qnashuv yoki xavfli vaziyat"
        # TODO: rasmiy metodika bilan almashtirilsin
        screen_text: "Kritik qoidabuzarlik: Xavfli to'qnashuv sodir bo'ldi!"
        voice_file: "critical_collision.wav"
        voice_text: "Kritik qoidabuzarlik. Imtihon to'xtatildi."
        reviewed: true
        reviewer: "metodist_uz"
      uz-Cyrl:
        title: "Тўсиққа тўқнашув ёки хавфли вазият"
        # TODO: rasmiy metodika bilan almashtirilsin
        screen_text: "Критик қоидабузарлик: Хавфли тўқнашув содир бўлди!"
        voice_file: "critical_collision.wav"
        voice_text: "Критик қоидабузарлик. Имтиҳон тўхтатилди."
        reviewed: true
        reviewer: "metodist_uz"
      ru:
        title: "Столкновение с препятствием или опасная ситуация"
        # TODO: rasmiy metodika bilan almashtirilsin
        screen_text: "Критическое нарушение: Столкновение с препятствием!"
        voice_file: "critical_collision.wav"
        voice_text: "Критическое нарушение. Экзамен остановлен."
        reviewed: true
        reviewer: "metodist_ru"

