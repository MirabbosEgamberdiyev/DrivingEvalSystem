[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "driving-eval-system"
version = "1.0.0"
description = "Standalone 4-Camera Offline AI Driving Training & Evaluation System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Driving Evaluation Architect" }
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "reportlab>=4.0",
    "PySide6>=6.5"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5"
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false
show_error_codes = true
disable_error_code = ["attr-defined", "assignment", "method-assign", "union-attr", "arg-type", "import-untyped", "import-not-found"]
